name: Max Payne Cloud Translation

on:
  workflow_dispatch: # Isse manual play button active hoga

# 👇 Yeh block add kiya hai taake bot ko file save karne ki ijazat mil jaye (403 Error Fix)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Google GenAI Package
      run: pip install google-genai

    - name: Execute Silent Cloud Translation
      env:
        GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      run: python -u translate.py

    # 👇 Yeh naya step hai. Yeh Git push hone se pehle aapki file ka backup GitHub par upload kar dega.
    - name: Backup Translated File
      uses: actions/upload-artifact@v4
      with:
        name: Translated-Roman-Urdu-File
        path: american_roman.oxt

    - name: Commit and Save Roman Urdu File
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add american_roman.oxt
        git commit -m "SUCCESS: Packaged New Subtitles" || exit 0
        git pull --rebase origin main 
        git push
        
  
